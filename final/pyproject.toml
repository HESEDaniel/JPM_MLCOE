[project]
name = "final"
version = "0.1.0"
description = "JPM MLCOE final round — dynamic deep-halo with state-space market context"
authors = [
    {name = "HESEDaniel",email = "haeun39@kaist.ac.kr"}
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib (==3.10.8)",
    "numpy (==1.26.4)",
    "tensorflow (==2.16.2)",
    "tensorflow-probability (==0.24.0)",
    "choice-learn (>=1.3.1,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]
